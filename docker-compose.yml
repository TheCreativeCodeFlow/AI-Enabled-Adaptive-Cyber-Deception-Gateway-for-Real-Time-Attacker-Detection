services:
  postgres:
    image: postgres:16-alpine
    container_name: deception-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deception_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deception_pass}
      POSTGRES_DB: ${POSTGRES_DB:-deception_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deception_user} -d ${POSTGRES_DB:-deception_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deception-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deception-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-deception_user}:${POSTGRES_PASSWORD:-deception_pass}@postgres:5432/${POSTGRES_DB:-deception_db}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deception-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deception-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      VITE_BACKEND_URL: http://localhost:4000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deception-network

volumes:
  postgres_data:
    driver: local

networks:
  deception-network:
    driver: bridge
